spring.application.name=etax-backend
server.port=8080

# MySQL — create the database first with: CREATE DATABASE etax;
# (see README.md for the full setup steps)
spring.datasource.url=jdbc:mysql://localhost:3306/etax?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT — change this secret before any real deployment (32+ random chars, keep it out of source control)
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING_1234567890
app.jwt.expiration-ms=86400000

# Angular dev server origin allowed to call this API
app.cors.allowed-origin=http://localhost:4200
