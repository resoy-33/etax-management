<mat-toolbar color="primary" class="navbar">
  <button
    *ngIf="showMenuButton"
    mat-icon-button
    class="menu-btn"
    aria-label="Ouvrir le menu"
    (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-icon class="logo-icon">account_balance</mat-icon>
  <span class="logo">Système de Gestion Fiscale</span>

  <span class="spacer"></span>

  <div class="right">
    <button mat-icon-button matTooltip="Notifications" aria-label="Notifications">
      <mat-icon matBadge="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    </button>

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu utilisateur">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/admin/profile">
        <mat-icon>account_circle</mat-icon>
        <span>Mon profil</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Déconnexion</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
